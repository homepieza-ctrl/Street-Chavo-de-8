name: Build APK
# TODO EN UN SOLO ARCHIVO (incluye icono). Si falla, el motivo sale en rojo en la pagina del build.
# Solo necesitas: este archivo en .github/workflows/build.yml  +  tu ROM (.sfc/.smc) en la raiz del repo.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generar proyecto Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          trap 'echo "::error title=Fallo al generar el proyecto::Comando que fallo: $BASH_COMMAND"' ERR
          mkdir -p /tmp/proj && cd /tmp/proj
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral(); maven("https://jitpack.io") }
          }
          rootProject.name = "StreetChaves2"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.streetchaves.game"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.streetchaves.game"
                  minSdk = 23
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  ndk { abiFilters += "arm64-v8a" }
              }
              packaging { jniLibs { useLegacyPackaging = true } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += "-Xskip-metadata-version-check"
              }
          }

          dependencies {
              implementation("com.github.Swordfish90:LibretroDroid:0.9.0")
              implementation("androidx.activity:activity-ktx:1.9.0")
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Street Chaves 2"
                  android:icon="@mipmap/ic_launcher"
                  android:extractNativeLibs="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/java/com/streetchaves/game
          cat > app/src/main/java/com/streetchaves/game/MainActivity.kt <<'EOF'
          package com.streetchaves.game

          import android.annotation.SuppressLint
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.widget.FrameLayout
          import android.widget.TextView
          import androidx.activity.ComponentActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import com.swordfish.libretrodroid.GLRetroView
          import com.swordfish.libretrodroid.GLRetroViewData
          import java.io.File
          import kotlin.math.atan2
          import kotlin.math.hypot
          import kotlin.math.min

          /** Palanca virtual de 8 direcciones: manda las flechas del D-pad al emulador. */
          class StickView(context: Context, private val onKey: (Int, Boolean) -> Unit) : View(context) {

              private val d = resources.displayMetrics.density
              private val basePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = 0x33FFFFFF
                  style = Paint.Style.FILL
              }
              private val ringPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = 0x88FFFFFF.toInt()
                  style = Paint.Style.STROKE
                  strokeWidth = 3f * d
              }
              private val knobPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = 0x99FFFFFF.toInt()
                  style = Paint.Style.FILL
              }

              private var kx = 0f
              private var ky = 0f
              private var curX = 0
              private var curY = 0
              private val dxs = intArrayOf(1, 1, 0, -1, -1, -1, 0, 1)
              private val dys = intArrayOf(0, 1, 1, 1, 0, -1, -1, -1)

              override fun onDraw(canvas: Canvas) {
                  val cx = width / 2f
                  val cy = height / 2f
                  val r = min(width, height) / 2f - 2f * d
                  canvas.drawCircle(cx, cy, r, basePaint)
                  canvas.drawCircle(cx, cy, r, ringPaint)
                  canvas.drawCircle(cx + kx, cy + ky, r * 0.36f, knobPaint)
              }

              @SuppressLint("ClickableViewAccessibility")
              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_MOVE -> update(e.x, e.y)
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          kx = 0f
                          ky = 0f
                          setDir(0, 0)
                          invalidate()
                      }
                  }
                  return true
              }

              private fun update(x: Float, y: Float) {
                  val r = min(width, height) / 2f
                  var vx = x - width / 2f
                  var vy = y - height / 2f
                  val dist = hypot(vx, vy)
                  val maxD = r * 0.6f
                  if (dist > maxD) {
                      vx = vx / dist * maxD
                      vy = vy / dist * maxD
                  }
                  kx = vx
                  ky = vy
                  if (dist < r * 0.2f) {
                      setDir(0, 0)
                  } else {
                      val a = Math.toDegrees(atan2(vy.toDouble(), vx.toDouble()))
                      val n = Math.round(a / 45.0).toInt()
                      val s = ((n % 8) + 8) % 8
                      setDir(dxs[s], dys[s])
                  }
                  invalidate()
              }

              private fun setDir(nx: Int, ny: Int) {
                  if (nx != curX) {
                      if (curX < 0) onKey(KeyEvent.KEYCODE_DPAD_LEFT, false)
                      if (curX > 0) onKey(KeyEvent.KEYCODE_DPAD_RIGHT, false)
                      if (nx < 0) onKey(KeyEvent.KEYCODE_DPAD_LEFT, true)
                      if (nx > 0) onKey(KeyEvent.KEYCODE_DPAD_RIGHT, true)
                      curX = nx
                  }
                  if (ny != curY) {
                      if (curY < 0) onKey(KeyEvent.KEYCODE_DPAD_UP, false)
                      if (curY > 0) onKey(KeyEvent.KEYCODE_DPAD_DOWN, false)
                      if (ny < 0) onKey(KeyEvent.KEYCODE_DPAD_UP, true)
                      if (ny > 0) onKey(KeyEvent.KEYCODE_DPAD_DOWN, true)
                      curY = ny
                  }
              }
          }

          class MainActivity : ComponentActivity() {

              private lateinit var retroView: GLRetroView
              private val d by lazy { resources.displayMetrics.density }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  WindowInsetsControllerCompat(window, window.decorView).apply {
                      hide(WindowInsetsCompat.Type.systemBars())
                      systemBarsBehavior =
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }

                  // Copiar la ROM de assets a un archivo real
                  val romName = assets.list("")?.firstOrNull { it.endsWith(".sfc") || it.endsWith(".smc") }
                      ?: error("No hay ROM (.sfc/.smc) en assets")
                  val rom = File(filesDir, romName)
                  assets.open(romName).use { i -> rom.outputStream().use { o -> i.copyTo(o) } }

                  val data = GLRetroViewData(this).apply {
                      coreFilePath = applicationInfo.nativeLibraryDir + "/libsnes9x.so"
                      gameFilePath = rom.absolutePath
                      systemDirectory = File(filesDir, "system").apply { mkdirs() }.absolutePath
                      savesDirectory = File(filesDir, "saves").apply { mkdirs() }.absolutePath
                  }
                  retroView = GLRetroView(this, data)
                  lifecycle.addObserver(retroView)

                  val root = FrameLayout(this)
                  root.addView(
                      retroView,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  )
                  setContentView(root)

                  // Palanca (izquierda)
                  val stick = StickView(this) { code, down ->
                      retroView.sendKeyEvent(
                          if (down) KeyEvent.ACTION_DOWN else KeyEvent.ACTION_UP,
                          code
                      )
                  }
                  val stickLp = FrameLayout.LayoutParams(
                      (160 * d).toInt(), (160 * d).toInt(), Gravity.BOTTOM or Gravity.START
                  )
                  stickLp.setMargins((30 * d).toInt(), 0, 0, (25 * d).toInt())
                  root.addView(stick, stickLp)

                  // 6 botones (derecha): fila de arriba Y X L, fila de abajo B A R
                  // Posicion fisica = layout Xbox de Android (B->BUTTON_A, A->BUTTON_B, Y->BUTTON_X, X->BUTTON_Y)
                  val gr = Gravity.BOTTOM or Gravity.END
                  val top = 100
                  val bot = 25
                  btn(root, "Y", KeyEvent.KEYCODE_BUTTON_X, gr, 0, 160, 0, top, 62, 62)
                  btn(root, "X", KeyEvent.KEYCODE_BUTTON_Y, gr, 0, 90, 0, top, 62, 62)
                  btn(root, "L", KeyEvent.KEYCODE_BUTTON_L1, gr, 0, 20, 0, top, 62, 62)
                  btn(root, "B", KeyEvent.KEYCODE_BUTTON_A, gr, 0, 160, 0, bot, 62, 62)
                  btn(root, "A", KeyEvent.KEYCODE_BUTTON_B, gr, 0, 90, 0, bot, 62, 62)
                  btn(root, "R", KeyEvent.KEYCODE_BUTTON_R1, gr, 0, 20, 0, bot, 62, 62)

                  // Select / Start
                  val bc = Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL
                  btn(root, "SELECT", KeyEvent.KEYCODE_BUTTON_SELECT, bc, 0, 0, 0, 15, 80, 36).translationX = -50 * d
                  btn(root, "START", KeyEvent.KEYCODE_BUTTON_START, bc, 0, 0, 0, 15, 80, 36).translationX = 50 * d
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun btn(
                  root: FrameLayout, label: String, keyCode: Int, gravity: Int,
                  ml: Int, mr: Int, mt: Int, mb: Int, w: Int = 60, h: Int = 60
              ): TextView {
                  val tv = TextView(this).apply {
                      text = label
                      setTextColor(Color.WHITE)
                      textSize = if (label.length > 1) 11f else 18f
                      this.gravity = Gravity.CENTER
                      background = GradientDrawable().apply {
                          shape = if (w == h) GradientDrawable.OVAL else GradientDrawable.RECTANGLE
                          cornerRadius = 20 * d
                          setColor(0x55FFFFFF)
                          setStroke((2 * d).toInt(), 0x99FFFFFF.toInt())
                      }
                      alpha = 0.6f
                      setOnTouchListener { v, e ->
                          when (e.actionMasked) {
                              MotionEvent.ACTION_DOWN -> {
                                  retroView.sendKeyEvent(KeyEvent.ACTION_DOWN, keyCode)
                                  v.alpha = 1f
                              }
                              MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                                  retroView.sendKeyEvent(KeyEvent.ACTION_UP, keyCode)
                                  v.alpha = 0.6f
                              }
                          }
                          true
                      }
                  }
                  val lp = FrameLayout.LayoutParams((w * d).toInt(), (h * d).toInt(), gravity)
                  lp.setMargins((ml * d).toInt(), (mt * d).toInt(), (mr * d).toInt(), (mb * d).toInt())
                  root.addView(tv, lp)
                  return tv
              }
          }
